---
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
      - run: npm ci
      - run: npm run check
  compatibility:
    name: >-
      ${{ (startsWith(github.head_ref, 'factory/pr/') ||
      startsWith(github.head_ref, 'factory/run/') ||
      github.event.pull_request.user.login == 'exe-dev-github-integration[bot]') &&
      'factory-compatibility' || 'factory-gates' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: printf '%s\n' 'Ordinary PR compatibility; not factory certification.'
