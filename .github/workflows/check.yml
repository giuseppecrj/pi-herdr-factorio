---
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
      - run: npm ci
      - name: Enable real sandbox tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap dbus-user-session
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          for _ in $(seq 30); do test -S "$XDG_RUNTIME_DIR/bus" && break; sleep 1; done
          bwrap --unshare-all --die-with-parent --ro-bind / / true
          systemd-run --user --scope --quiet true
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - run: npm run check
        env:
          FACTORY_REQUIRE_SANDBOX_TESTS: "1"
  compatibility:
    name: >-
      ${{ (startsWith(github.head_ref, 'factory/pr/') ||
      startsWith(github.head_ref, 'factory/run/') ||
      github.event.pull_request.user.login == 'exe-dev-github-integration[bot]') &&
      'factory-compatibility' || 'factory-gates' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: printf '%s\n' 'Ordinary PR compatibility; not factory certification.'
