---
name: model-smoke

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: Exact provider/model-id to ask
        default: cliproxyapi/claude-haiku-5-5

permissions:
  contents: read
  id-token: write

concurrency:
  group: model-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf  # v4.3.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          oauth-client-id: ${{ secrets.TS_AUTHKEY == '' && vars.TS_OIDC_CLIENT_ID || '' }}
          audience: ${{ secrets.TS_AUTHKEY == '' && vars.TS_OIDC_AUDIENCE || '' }}
          tags: tag:factory-ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the path to the proxy without printing tailnet names
        env:
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
        run: scripts/proxy-path-check.sh

      - name: Install Pi and the model provider
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.4.0
          pi install npm:@router-for-me/pi-cliproxyapi-provider@1.4.24

      - name: Ask the model through the tailnet proxy
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
          MODEL: ${{ inputs.model || 'cliproxyapi/claude-haiku-5-5' }}
          PROMPT: "Reply with exactly this token and nothing else: factory-smoke-ok"
        run: |
          out=$(pi -p --no-session --no-approve \
            --model "$MODEL" --thinking low "$PROMPT")
          printf '%s\n' "$out"
          grep -qx 'factory-smoke-ok' <<<"$out"
