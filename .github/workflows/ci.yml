---
name: candidate gates
run-name: gates ${{ inputs.candidate_sha }} ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit (40 lowercase hex characters)
        required: true
        type: string
      nonce:
        description: Unique controller dispatch identifier
        required: true
        type: string
      replacements:
        description: Digest-checked private contract replacement list (no contract text)
        default: '[]'
        type: string
      replacements_digest:
        description: SHA-256 of canonical replacement list JSON
        default: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
        type: string
permissions:
  contents: read
jobs:
  gates:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - name: Prepare trusted controller
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GATE_SHA: ${{ github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GATE_SHA"
          git fetch --no-tags origin "$CANDIDATE_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          docker pull node@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
      - name: Run trusted gates
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GATE_SHA: ${{ github.sha }}
          NONCE: ${{ inputs.nonce }}
          REPLACEMENTS: ${{ inputs.replacements }}
          REPLACEMENTS_DIGEST: ${{ inputs.replacements_digest }}
        run: |
          node --experimental-strip-types server/cli.ts gates \
            --repository "$PWD" --gate-sha "$GATE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --nonce "$NONCE" --output "$RUNNER_TEMP/gate-results" \
            --replacements "$REPLACEMENTS" --replacements-digest "$REPLACEMENTS_DIGEST"
      - name: Upload trusted receipt
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-receipt
          path: ${{ runner.temp }}/gate-results/
          if-no-files-found: error
          retention-days: 14
