---
name: herdr-probe

on:
  push:
    branches: [factory-herdr-probe]
    paths:
      - scripts/herdr-probe.sh
      - .github/workflows/herdr-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herdr-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf  # v4.3.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:factory-ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the path to the proxy without printing tailnet names
        env:
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
        run: scripts/proxy-path-check.sh

      - name: Install pinned Herdr
        run: |
          started=$SECONDS
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --silent --show-error --location \
            https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64 \
            --output "$RUNNER_TEMP/herdr-bin/herdr"
          sha=14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
          echo "$sha  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
          echo "herdr_install_seconds=$((SECONDS - started))"

      - name: Prove parent receives a child result through headless Herdr
        env:
          CLIPROXYAPI_BASE_URL: ${{ secrets.CLIPROXYAPI_BASE_URL }}
          CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
        # Driver installs npm Pi 1.4.0, provider 1.4.24 and host 3.3.1 in a
        # disposable HOME. Only fixed evidence lines are public; no artifacts.
        run: timeout 5m scripts/herdr-probe.sh
